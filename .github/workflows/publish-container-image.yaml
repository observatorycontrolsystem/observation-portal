name: "Publish Container Image"
on:
  push:
    paths:
      # On Release we build the container and check-in the Component back into the default branch.
      # These rules prevent this workflow from going into an infinite loop.
      - "**"
      - "!k8s/**"
      - "k8s/base/**"
      - "!k8s/base/components/ghcr-images/**"
    branches:
      - "**"

  workflow_dispatch:

  release:
    types:
      - published
env:
  DEFAULT_BRANCH_NAME: main

jobs:
  publish:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    concurrency:
      group: build-container-image

    permissions:
      packages: write
      contents: read

    steps:

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |-
            [worker.oci]
              max-parallelism = 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            accept-flake-config = true

      - name: Login to GHCR Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        run: |-
          export SKAFFOLD_BUILDX_ARGS="--cache-to type=gha,mode=max,ignore-error=true --cache-from type=gha"
          nix run .#skaffold -- build -m "obs-portal" \
          --file-output built-images.json --default-repo "ghcr.io/$GITHUB_REPOSITORY" --push

      - name: Convert Skaffold output to Kustomize Component
        run: |-
          # Create the component if does not exist
          mkdir -p k8s/base/components/ghcr-images
          cd k8s/base/components/ghcr-images
          cat << 'EOF' > kustomization.yaml
          # This file was generated by a bot.
          # Any changes will be overwritten.

          apiVersion: kustomize.config.k8s.io/v1alpha1
          kind: Component
          EOF

          jq -r '.builds[] | "\(.imageName)=\(.tag)"' "$GITHUB_WORKSPACE/built-images.json" | xargs -L1 nix run .#kustomize -- edit set image

      - name: Generate commit message
        id: commitInfo
        env:
          release_title: ${{ github.event.release.name }}
          release_body: ${{ github.event.release.body }}
        run: |-
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            echo "title=$release_title" >> "$GITHUB_OUTPUT"

            echo "body<<EOF" >> "$GITHUB_OUTPUT"
            echo "$release_body" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            # %s extracts only the subject line (title) of the commit
            TITLE=$(git log -1 --pretty=format:"%s")
            echo "title=$TITLE" >> "$GITHUB_OUTPUT"

            BODY=$(git log -1 --pretty=%b)

            echo "body<<EOF" >> "$GITHUB_OUTPUT"

            if [[ -n "$BODY" ]]; then
              echo "$BODY" >> "$GITHUB_OUTPUT"
              echo "" >> "$GITHUB_OUTPUT"
            fi

            echo "Source-commit: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker meta
        uses: docker/metadata-action@v6
        with:
          sep-tags: ","
          tags: |
              type=ref,event=branch
              type=ref,event=tag
              type=ref,event=pr
              type=sha,enable=true,priority=100,prefix=,suffix=,format=long

      - name: Push base Kustomization to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          commitTitle: ${{ steps.commitInfo.outputs.title || '' }}
          commitBody: ${{ steps.commitInfo.outputs.body || '' }}
        run: |-
          set -eo pipefail

          # expand_github_links <text> <default_owner/repo>
          expand_github_links() {
              local text="$1"
              local default_target="$2"

              # 1. Expand standard shortlinks: #123 -> https://github.com
              # 2. Expand cross-repo shortlinks: owner/repo#123 -> https://github.com
              # 3. Expand commit SHAs: #abc1234 -> https://github.com
              echo "$text" | sed -E \
                  -e "s|([a-zA-Z0-9_-]+/[a-zA-Z0-9_-]+)#([0-9]+)|https://github.com/\1/issues/\2|g" \
                  -e "s|#([0-9]+)|https://github.com/${default_target}/issues/\1|g" \
                  -e "s|#([0-9a-fA-F]{7,40})|https://github.com/${default_target}/commit/\1|g"
          }

          # Update base Kustomization w/ built images
          pushd k8s/base/
          jq -r '.builds[] | "\(.imageName)=\(.tag)"' "$GITHUB_WORKSPACE/built-images.json" | xargs -L1 nix run .#kustomize -- edit set image

          # Create an annotations file to avoid complex escaping
          tmp=$(mktemp -d)
          jq -n \
            --arg title "$(expand_github_links "$commitTitle" "$GITHUB_REPOSITORY")" \
            --arg description "$(expand_github_links "$commitBody" "$GITHUB_REPOSITORY")" \
            --arg source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA" \
            '{"$manifest": {"org.opencontainers.image.title": $title, "org.opencontainers.image.description": $description, "org.opencontainers.image.source": $source}}' > "$tmp/annotations.json"

          # Upload to ghcr.io
          echo "$GITHUB_TOKEN" | nix run --inputs-from . nixpkgs#oras -- login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          nix run --inputs-from . nixpkgs#oras -- push \
            --annotation-file "$tmp/annotations.json" \
            "ghcr.io/${GITHUB_REPOSITORY,,}/k8s/base:$DOCKER_METADATA_OUTPUT_TAGS" ./:application/vnd.oci.image.layer.v1.tar+gzip

      - name: Create a PR to merge the Component into the default branch
        if: github.event_name == 'release'
        env:
          actorName: ${{ format('{0}', github.actor) }}
          actorEmail: ${{ format('{1}+{0}@users.noreply.github.com', github.actor, github.actor_id) }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_OCTOPILOT }}
          commitTitle: ${{ steps.commitInfo.outputs.title || 'update container images kustomize component' }}
          commitBody: ${{ steps.commitInfo.outputs.body || '' }}
        run: |-
          git config --global user.name "$actorName"
          git config --global user.email "$actorEmail"
          commit_title_template='{{ env "commitTitle" | expandGithubLinks "${{ github.repository }}" }}'
          pr_title_template="$commit_title_template"

          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            commit_body_template='{{ githubRelease "${{ github.repository }}/${{ github.event.release.tag_name }}" | expandGithubLinks "${{ github.repository }}" }}'
            pr_body_template="$commit_body_template"
          else
            commit_body_template='{{ env "commitBody" | expandGithubLinks "${{ github.repository }}" }}'
            pr_body_template='{{ (or (env "commitBody") " ") | expandGithubLinks "${{ github.repository }}" }}'
          fi

          nix run github:LCOGT/devenv-k8s#octopilot -- \
            --fail-on-error --log-level debug \
            --github-auth-method token \
            --repo "$GITHUB_REPOSITORY(branch=$DEFAULT_BRANCH_NAME)" \
            \
            --update 'exec(cmd=sh,args=-c `mkdir -p k8s/base/components/ghcr-images && cp "$GITHUB_WORKSPACE/k8s/base/components/ghcr-images/kustomization.yaml" k8s/base/components/ghcr-images/kustomization.yaml`)' \
            \
            --git-stage-all-changed=false \
            --git-stage-pattern 'k8s/base/components/ghcr-images' \
            --git-branch-prefix 'chore/k8s-update-images-component/' \
            --git-author-name "$actorName" \
            --git-author-email "$actorEmail" \
            \
            --git-commit-title "$commit_title_template" \
            --git-commit-body "$commit_body_template" \
            --git-commit-footer "" \
            \
            --strategy reset \
            --pr-title-update-operation replace \
            --pr-body-update-operation replace \
            --pr-title "$pr_title_template" \
            --pr-body "$pr_body_template" \
            --pr-base-branch "$DEFAULT_BRANCH_NAME" \
            --pr-merge \
            --pr-merge-branch-protection all \
            --pr-merge-method squash \
            --pr-merge-commit-title "$commit_title_template" \
            --pr-merge-commit-message "$commit_body_template" \
            --pr-labels chore,update-container-images-component,release-notes-ignore
